name: mod_confcheckin
summary: 'Conference Check-in — a Moodle activity for issuing and selling conference tickets, printing QR-coded badges, recording attendance, and issuing certificates.'
description: |
  Sells and issues conference tickets through Moodle's `core_payment` — with
  ticket types, promo codes, availability windows, capacities and
  group/enrolment auto-grants — renders QR-coded badges, tickets, receipts and
  certificates to PDF (Japanese-capable font embedded), and records attendance
  with a camera QR scanner that also works in the Moodle app, backed by a
  check-in report. Part of the Conference Tools suite.
labels:
  # Required disclosure labels — pick all that apply (RFC §4.7):
  #   fully-free | freemium | paid-service | external-account
  #   donation-supported | commercial-support-available
  - fully-free
screenshots:
  - path: .camp/screenshots/01-buy-ticket.png
    caption: 'An attendee buys or claims a ticket: a promo code box, an early-bird type outside its sales window, and paid types with Buy buttons.'
  - path: .camp/screenshots/02-my-ticket.png
    caption: 'An attendee''s ticket, how it was obtained and whether they have checked in, with links to their badge, ticket, receipt and certificate PDFs.'
  - path: .camp/screenshots/03-badge-pdf.png
    caption: 'A generated badge PDF from an organiser''s template: the presenter''s name, ticket type, presentation and unique QR code.'
  - path: .camp/screenshots/04-scan-checkin.png
    caption: 'The camera scanner reading a ticket''s QR code and recording the check-in.'
  - path: .camp/screenshots/05-checkin-report.png
    caption: 'The check-in report: every participant''s ticket and check-in status, with manual check-in and remove buttons.'
  - path: .camp/screenshots/06-ticket-types.png
    caption: 'Managing ticket types: price, capacity used, limit per user, presenter-only, a visibility switch, auto-grant, eligibility and add-to-group.'
  - path: .camp/screenshots/07-templates.png
    caption: Editing the badge template in the Moodle editor, with the available placeholders and the presentation line format.
  - path: .camp/screenshots/08-promo-codes.png
    caption: 'Promo codes: which ticket type each one grants, uses so far and expiry.'
