name: Conference Check-in
summary: 'Conference Check-in sells and issues conference tickets in a Moodle course, prints QR-coded badges and tickets plus receipts and certificates, and records check-in with a camera QR scanner.'
description: |
  The registration desk of the Conference Tools suite (with Conference
  Submissions, Conference Program and Conference Scheduler).

  - **Ticket types** with a price in any ISO 4217 currency, an optional
    capacity, limit per user and sales window (such as an early bird), a
    visibility switch, presenter-only types for speakers on accepted
    submissions in the linked Conference Program, group or enrolment-method
    eligibility, automatic free tickets for a group or enrolment method (with
    an Orphaned tickets report), and adding ticket holders to a group.
  - **Getting a ticket:** paid tickets through Moodle's own payment system
    (`core_payment`) and the site's gateway; free types, promo codes and
    auto-grants issue a ticket straight away.
  - **PDFs:** organiser-edited badge, ticket, receipt and certificate
    templates with placeholders and a unique QR code, rendered with a bundled
    Japanese-capable font. Receipts are for bought tickets; certificates become
    available after check-in. Organisers can download each type as one ZIP.
  - **Check-in:** a camera QR scanner (built-in barcode detection, or the
    included jsQR decoder in Safari and Firefox) with a green flash, a tick and
    a beep that can be muted; it needs HTTPS. A sortable check-in report lists
    every enrolled participant, with manual check-in and remove.
  - Backup and restore (restored tickets get new QR codes), course reset, and a
    privacy provider.

  Requires Moodle 5.2 or 5.3 and mod_confprogram. A Moodle app view for
  scanning is included but has not yet been tested in a real app build.
labels:
  # Required disclosure labels — pick all that apply (RFC §4.7):
